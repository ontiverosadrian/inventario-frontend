<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes - Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>📦 Sistema Inventario</h2>
        <nav id="sidebarNav"></nav>
    </div>
    <div class="main-content">
        <h1>📋 Gestión de Solicitudes</h1>
        <div class="content-grid">
            <div class="card">
                <h3>Nueva Solicitud</h3>
                <form id="solicitudForm">
                    <select id="productoSelect" required style="width:100%; padding:10px; margin-bottom:10px;"></select>
                    <input type="number" id="cantidad" placeholder="Cantidad" required style="width:100%; padding:10px; margin-bottom:10px;">
                    <button type="submit" style="width:100%; padding:10px; background:#2563eb; color:white; border:none;">Crear</button>
                </form>
            </div>
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Producto</th><th>Cant.</th><th>Estado</th><th>Acción</th></tr></thead>
                        <tbody id="tablaSolicitudes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Aquí va el mismo script de funciones (cargarSolicitudes, cambiarEstado, etc.) que te di en el mensaje anterior.
        // Asegúrate de mantener la lógica de cargarProductosEnSelect y cargarSolicitudes.
    </script>
</body>
</html>
