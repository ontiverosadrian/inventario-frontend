<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { padding: 20px; background: #f4f4f9; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; }
        button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-aprob { background: #28a745; }
        .btn-rech { background: #dc3545; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Productos</a>
        <a href="solicitudes.html">Solicitudes</a>
        <button onclick="cerrarSesion()" style="float: right; background: #6c757d; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
    </nav>

    <h1>Solicitudes</h1>
    <br>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Solicitante</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="listaSolicitudes">
                <tr><td colspan="4">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://inventario-backend-mojz.onrender.com";
        const token = localStorage.getItem("token");
        const rol = localStorage.getItem("rolUsuario");

        if (!token) window.location.href = "login.html";

        async function cargarSolicitudes() {
            try {
                const res = await fetch(`${API_URL}/api/solicitudes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const solicitudes = await res.json();
                const lista = document.getElementById("listaSolicitudes");
                
                if (solicitudes.length === 0) {
                    lista.innerHTML = '<tr><td colspan="4" style="text-align: center;">No hay solicitudes.</td></tr>';
                    return;
                }

                lista.innerHTML = solicitudes.map(s => `
                    <tr>
                        <td>${s.titulo}</td>
                        <td>${s.solicitante}</td>
                        <td><strong>${s.estado}</strong></td>
                        <td>
                            ${rol === "ADMIN" ? `
                                <button class="btn-aprob" onclick="cambiarEstado('${s._id}', 'Aprobada')">Aprobar</button>
                                <button class="btn-rech" onclick="cambiarEstado('${s._id}', 'Rechazada')">Rechazar</button>
                            ` : '<span style="color: #666; font-size: 13px;">Solo lectura</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function cambiarEstado(id, nuevoEstado) {
            if (rol !== "ADMIN") return;

            const res = await fetch(`${API_URL}/api/solicitudes/${id}/estado`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ estado: nuevoEstado })
            });

            if (res.ok) {
                cargarSolicitudes();
            } else {
                alert("Error al actualizar estado");
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        cargarSolicitudes();
    </script>
</body>
</html>
