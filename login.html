<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Inventario</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f6f9; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { margin-bottom: 20px; color: #1e293b; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #475569; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
        .btn-submit { background-color: #2563eb; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>📦 Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
            <p id="errorMsg" class="error-msg">Credenciales incorrectas</p>
        </form>
    </div>

    <script>
        const API_URL = "https://inventario-backend-mojz.onrender.com";

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Guardar token y el rol exacto que viene del backend
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("rolUsuario", data.rol || data.usuario?.rol || "USER");
                    
                    window.location.href = "index.html";
                } else {
                    errorMsg.textContent = data.mensaje || "Error al iniciar sesión";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Error de conexión con el servidor";
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
