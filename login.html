<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Inventario Zayra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f7f6; }
        
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #34495e; font-size: 14px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #2c3e50; }
        
        .btn-submit { background: #2c3e50; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; transition: 0.3s; }
        .btn-submit:hover { background: #1a252f; }
        
        .error-msg { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-top: 15px; display: none; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>📦 Inventario Zayra</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn-submit">Ingresar</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script>
        const API_URL = "https://inventario-backend-mojz.onrender.com";

        // Si ya hay una sesión activa, redirigir directo al index
        if (localStorage.getItem("token")) {
            window.location.href = "index.html";
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            errorMsg.style.display = "none";

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Guardamos el token y el rol devuelto por el backend
                    localStorage.setItem("token", data.token);
                    // Captura el rol ya sea data.rol o data.usuario.rol dependiendo de cómo responda tu API
                    const rolAsignado = data.rol || (data.usuario && data.usuario.rol) || "USER";
                    localStorage.setItem("rolUsuario", rolAsignado);
                    
                    // Redirigir a la vista principal de productos
                    window.location.href = "index.html";
                } else {
                    errorMsg.textContent = data.mensaje || "Credenciales incorrectas";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Error de conexión con el servidor";
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
