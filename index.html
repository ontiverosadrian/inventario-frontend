<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #f4f6f9; }
        
        .sidebar { width: 260px; background-color: #1e293b; color: white; padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
        .sidebar h2 { font-size: 20px; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .sidebar nav a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; font-size: 15px; transition: 0.2s; }
        .sidebar nav a:hover, .sidebar nav a.active { background-color: #334155; color: white; }
        
        .btn-logout { background-color: #dc2626; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; text-align: center; }
        .btn-logout:hover { background-color: #b91c1c; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .page-title { font-family: 'Caveat', cursive; font-size: 38px; color: #1e293b; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; }

        .content-grid { display: grid; grid-template-columns: 1fr; gap: 30px; max-width: 600px; }

        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #e2e8f0; }
        .card h3 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; color: #1e293b; margin-bottom: 15px; }
        .card p { color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        .btn-primary { background-color: #2563eb; color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; font-size: 15px; text-align: center; text-decoration: none; display: inline-block; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <!-- Barra lateral -->
    <div class="sidebar">
        <div>
            <h2>📦 Inventario</h2>
            <nav>
                <a href="index.html" class="active">Productos</a>
                <a href="solicitudes.html">Solicitudes</a>
                <a href="reportes.html">Reportes</a>
            </nav>
        </div>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h1 class="page-title">🏠 Panel Principal</h1>

        <div class="content-grid">
            <div class="card">
                <h3>Bienvenido al Sistema</h3>
                <p>Utiliza el menú lateral izquierdo para acceder rápidamente a la gestión de productos, revisar y autorizar solicitudes, o ver los reportes del inventario.</p>
                <a href="productos.html" class="btn-primary">Ver Productos</a>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
