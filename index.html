<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            background-color: #f4f6f9;
            height: 100vh;
        }
        /* Barra lateral */
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 30px;
        }
        .sidebar nav a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background-color: #334155;
            color: white;
        }
        .user-info {
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .btn-logout {
            width: 100%;
            padding: 8px;
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-logout:hover {
            background-color: #b91c1c;
        }
        /* Contenido principal */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #475569;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        table th {
            background-color: #f8fafc;
            color: #475569;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div>
            <h2>📦 Sistema Inventario</h2>
            <nav>
                <a href="index.html" class="active">Productos</a>
                <a href="solicitudes.html">Solicitudes</a>
                <a href="reportes.html">Reportes</a>
            </nav>
        </div>
        <div class="user-info">
            <p><strong>Administrador</strong></p>
            <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Contenido -->
    <div class="main-content">
        <div class="card">
            <h3>Gestión de Productos</h3>
            <h4 style="margin-bottom: 15px; color: #64748b; font-size: 14px;">Registrar Nuevo Producto</h4>
            <form id="productForm">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" required placeholder="Ej. Monitor gamer">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" id="descripcion" placeholder="Ej. Monitor alta gama">
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <input type="text" id="categoria" placeholder="Ej. Electrónica">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" required placeholder="10">
                    </div>
                    <div class="form-group">
                        <label>Unidad de Medida</label>
                        <input type="text" id="unidadMedida" required placeholder="Piezas">
                    </div>
                </div>
                <div class="form-group">
                    <label>Stock Mínimo</label>
                    <input type="number" id="stockMinimo" required placeholder="2">
                </div>
                <button type="submit" class="btn-primary">Guardar Producto</button>
            </form>
        </div>

        <div class="card">
            <h3>Inventario Actual</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Cantidad</th>
                        <th>Unidad</th>
                        <th>Stock Mín.</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    <!-- Los productos se cargarán aquí automáticamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL base de tu backend en Render
        const API_URL = "https://inventario-backend-mojz.onrender.com";

        // Obtener el token de autenticación
        const token = localStorage.getItem("token");

        // Función para cargar los productos desde el backend
        async function cargarProductos() {
            try {
                const response = await fetch(`${API_URL}/api/productos`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error("No se pudieron cargar los productos");

                const productos = await response.json();
                const tbody = document.getElementById("tablaProductos");
                tbody.innerHTML = "";

                productos.forEach(prod => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${prod.nombre || ''}</td>
                        <td>${prod.descripcion || ''}</td>
                        <td>${prod.categoria || ''}</td>
                        <td>${prod.cantidad || 0}</td>
                        <td>${prod.unidadMedida || ''}</td>
                        <td>${prod.stockMinimo || 0}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error al cargar productos:", error);
            }
        }

        // Registrar un nuevo producto al enviar el formulario
        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nuevoProducto = {
                nombre: document.getElementById("nombre").value,
                descripcion: document.getElementById("descripcion").value,
                categoria: document.getElementById("categoria").value,
                cantidad: Number(document.getElementById("cantidad").value),
                unidadMedida: document.getElementById("unidadMedida").value, // Incluido correctamente
                stockMinimo: Number(document.getElementById("stockMinimo").value)
            };

            try {
                const response = await fetch(`${API_URL}/api/productos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(nuevoProducto)
                });

                const data = await response.json();

                if (response.ok) {
                    alert("¡Producto guardado con éxito!");
                    document.getElementById("productForm").reset();
                    cargarProductos(); // Refresca la tabla automáticamente
                } else {
                    alert("Error: " + (data.error || data.mensaje || "No se pudo guardar"));
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("No se pudo conectar con el servidor.");
            }
        });

        // Botón de cerrar sesión
        document.getElementById("btnLogout").addEventListener("click", () => {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        });

        // Cargar productos al abrir la página
        document.addEventListener("DOMContentLoaded", cargarProductos);
    </script>
</body>
</html>
