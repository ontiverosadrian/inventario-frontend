<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { padding: 20px; background: #f4f4f9; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; }
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-add { background: #28a745; color: white; }
        .admin-only { display: none; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Productos</a>
        <a href="solicitudes.html">Solicitudes</a>
        <button onclick="cerrarSesion()" style="float: right; background: #6c757d; color: white;">Cerrar Sesión</button>
    </nav>

    <h1>Productos</h1>
    <br>

    <!-- Panel exclusivo para Administrador -->
    <div id="adminPanel" class="card admin-only">
        <h3>Agregar Producto</h3>
        <div style="margin-top: 10px;">
            <input type="text" id="nombre" placeholder="Nombre" style="padding: 8px; margin-right: 10px;">
            <input type="number" id="cantidad" placeholder="Stock" style="padding: 8px; margin-right: 10px;">
            <button class="btn-add" onclick="guardarProducto()">Guardar</button>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="listaProductos">
                <tr><td colspan="3">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://inventario-backend-mojz.onrender.com";
        const token = localStorage.getItem("token");
        const rol = localStorage.getItem("rolUsuario");

        if (!token) window.location.href = "login.html";

        if (rol === "ADMIN") {
            document.getElementById("adminPanel").style.display = "block";
        }

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/api/productos`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const productos = await res.json();
                const lista = document.getElementById("listaProductos");
                
                lista.innerHTML = productos.map(p => `
                    <tr>
                        <td>${p.nombre}</td>
                        <td>${p.cantidad}</td>
                        <td>
                            ${rol === "ADMIN" ? `
                                <button class="btn-delete" onclick="eliminarProducto('${p._id}')">Eliminar</button>
                            ` : '<span style="color: #666; font-size: 13px;">Solo lectura</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function guardarProducto() {
            const nombre = document.getElementById("nombre").value;
            const cantidad = document.getElementById("cantidad").value;

            const res = await fetch(`${API_URL}/api/productos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ nombre, cantidad })
            });

            if (res.ok) {
                document.getElementById("nombre").value = "";
                document.getElementById("cantidad").value = "";
                cargarProductos();
            } else {
                alert("Error al guardar");
            }
        }

        async function eliminarProducto(id) {
            if (rol !== "ADMIN") return;
            if (!confirm("¿Seguro que deseas eliminar?")) return;

            const res = await fetch(`${API_URL}/api/productos/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) cargarProductos();
            else alert("No autorizado para eliminar");
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        cargarProductos();
    </script>
</body>
</html>
