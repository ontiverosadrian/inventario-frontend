<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Productos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            background-color: #f4f6f9;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 30px;
        }
        .sidebar nav a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background-color: #334155;
            color: white;
        }
        .user-info {
            border-top: 1px solid #334155;
            padding-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 35px;
            height: 35px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .user-details p {
            font-size: 14px;
        }
        .user-tag {
            font-size: 10px;
            background-color: #1d4ed8;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .btn-logout {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            padding: 0;
        }
        .btn-logout:hover {
            text-decoration: underline;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .page-title {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 25px;
        }
        .content-grid {
            display: flex;
            gap: 25px;
        }
        .card-form {
            width: 380px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .card-table {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card-form h3, .card-table h3 {
            margin-bottom: 20px;
            color: #1e293b;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #475569;
            font-size: 13px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-danger {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-danger:hover {
            background-color: #b91c1c;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table th, table td {
            padding: 12px 10px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 13px;
        }
        table th {
            color: #64748b;
            font-weight: 600;
        }
        .no-data {
            text-align: center;
            color: #94a3b8;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>📦 Sistema Inventario</h2>
            <nav id="sidebarNav"></nav>
        </div>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">A</div>
            <div class="user-details">
                <p><strong id="userName">Administrador</strong></p>
                <span class="user-tag" id="userTag">ADMIN</span>
                <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <h2 class="page-title">📦 Gestión de Productos</h2>

        <div class="content-grid">
            <div class="card-form">
                <h3>Registrar Nuevo Producto</h3>
                <form id="productForm">
                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="nombre" required placeholder="Ej. Monitor gamer">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" id="descripcion" placeholder="Ej. Monitor alta gama">
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <input type="text" id="categoria" placeholder="Ej. Electrónica">
                    </div>
                    <div class="form-group">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" required placeholder="10">
                    </div>
                    <div class="form-group">
                        <label>Unidad de Medida</label>
                        <input type="text" id="unidadMedida" required placeholder="Piezas">
                    </div>
                    <div class="form-group">
                        <label>Stock Mínimo</label>
                        <input type="number" id="stockMinimo" required placeholder="2">
                    </div>
                    <button type="submit" class="btn-primary">Guardar Producto</button>
                </form>
            </div>

            <div class="card-table">
                <h3>Inventario Actual</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Cant.</th>
                            <th>Unidad</th>
                            <th>Stock Mín.</th>
                            <th id="thAcciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <tr>
                            <td colspan="7" class="no-data">No hay productos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://inventario-backend-mojz.onrender.com";
        const token = localStorage.getItem("token");
        const rolUsuario = localStorage.getItem("rolUsuario") || "USER";

        if (rolUsuario !== "ADMIN") {
            alert("Acceso denegado. Sección exclusiva para administradores.");
            window.location.href = "solicitudes.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const nombre = localStorage.getItem("nombreUsuario") || "Administrador";
            document.getElementById("userName").textContent = nombre;
            document.getElementById("userTag").textContent = rolUsuario;
            document.getElementById("userAvatar").textContent = nombre.charAt(0).toUpperCase();

            const nav = document.getElementById("sidebarNav");
            nav.innerHTML = `
                <a href="index.html" class="active">Productos</a>
                <a href="solicitudes.html">Solicitudes</a>
                <a href="reportes.html">Reportes</a>
            `;

            cargarProductos();
        });

        document.getElementById("btnLogout").addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "login.html";
        });

        async function cargarProductos() {
            try {
                const response = await fetch(`${API_URL}/api/productos`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) return;

                const productos = await response.json();
                const tbody = document.getElementById("tablaProductos");

                if (productos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="no-data">No hay productos registrados.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                productos.forEach(prod => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${prod.nombre || ''}</td>
                        <td>${prod.descripcion || ''}</td>
                        <td>${prod.categoria || ''}</td>
                        <td>${prod.cantidad || 0}</td>
                        <td>${prod.unidadMedida || ''}</td>
                        <td>${prod.stockMinimo || 0}</td>
                        <td><button class="btn-danger" onclick="eliminarProducto('${prod._id || prod.id}')">Eliminar</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error al cargar productos:", error);
            }
        }

        async function eliminarProducto(id) {
            if (!confirm("¿Estás seguro de eliminar este producto?")) return;

            try {
                const response = await fetch(`${API_URL}/api/productos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    alert("Producto eliminado correctamente");
                    cargarProductos();
                } else {
                    alert("Error al eliminar el producto");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar con el servidor.");
            }
        }

        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nuevoProducto = {
                nombre: document.getElementById("nombre").value,
                descripcion: document.getElementById("descripcion").value,
                categoria: document.getElementById("categoria").value,
                cantidad: Number(document.getElementById("cantidad").value),
                unidadMedida: document.getElementById("unidadMedida").value,
                stockMinimo: Number(document.getElementById("stockMinimo").value)
            };

            try {
                const response = await fetch(`${API_URL}/api/productos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(nuevoProducto)
                });

                if (response.ok) {
                    alert("¡Producto guardado con éxito!");
                    document.getElementById("productForm").reset();
                    cargarProductos();
                } else {
                    alert("Error al guardar el producto.");
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("No se pudo conectar con el servidor.");
            }
        });
    </script>
</body>
</html>
