<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <!-- Importamos una fuente estilo manuscrito/cursivo similar a la de tu imagen -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #f4f6f9; }
        
        /* Barra lateral oscura */
        .sidebar { width: 260px; background-color: #1e293b; color: white; padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
        .sidebar h2 { font-size: 20px; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .sidebar nav a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; font-size: 15px; transition: 0.2s; }
        .sidebar nav a:hover, .sidebar nav a.active { background-color: #334155; color: white; }
        
        .btn-logout { background-color: #dc2626; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; text-align: center; }
        .btn-logout:hover { background-color: #b91c1c; }

        /* Contenido principal */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .page-title { font-family: 'Caveat', cursive; font-size: 38px; color: #1e293b; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; }

        /* Estructura de dos columnas */
        .content-grid { display: grid; grid-template-columns: 420px 1fr; gap: 30px; align-items: start; }
        @media (max-width: 1024px) { .content-grid { grid-template-columns: 1fr; } }

        /* Tarjetas blancas redondeadas */
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #e2e8f0; }
        .card h3 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; color: #1e293b; margin-bottom: 20px; }

        /* Campos de formulario */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #64748b; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #2563eb; }
        
        .btn-primary { background-color: #2563eb; color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; font-size: 15px; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1d4ed8; }
        
        .btn-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-danger:hover { background-color: #fee2e2; }

        /* Tablas */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th { color: #64748b; font-weight: 600; font-size: 13px; text-transform: uppercase; padding: 12px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        td { padding: 15px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 14px; }
        
        .admin-only { display: none; }
        .readonly-text { font-size: 13px; color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>

    <!-- Barra lateral -->
    <div class="sidebar">
        <div>
            <h2>📦 Inventario</h2>
            <nav>
                <a href="index.html">Productos</a>
                <a href="solicitudes.html">Solicitudes</a>
                <a href="reportes.html">Reportes</a>
            </nav>
        </div>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h1 class="page-title">📋 Gestión de Productos</h1>

        <div class="content-grid">
            <!-- Formulario / Izquierda (Visible solo para ADMIN) -->
            <div id="adminPanel" class="card admin-only">
                <h3>Nuevo Producto</h3>
                
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" placeholder="Ej. Taladro percutor">
                </div>

                <div class="form-group">
                    <label>Cantidad / Stock</label>
                    <input type="number" id="cantidad" placeholder="Ej. 10">
                </div>

                <button class="btn-primary" onclick="guardarProducto()">Crear Producto</button>
            </div>

            <!-- Tabla / Derecha -->
            <div class="card">
                <h3>Productos Registrados</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Stock</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="listaProductos">
                            <tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 30px;">Cargando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://inventario-backend-mojz.onrender.com";
        const token = localStorage.getItem("token");
        const rol = localStorage.getItem("rolUsuario");

        if (!token) window.location.href = "login.html";
        if (rol === "ADMIN") document.getElementById("adminPanel").style.display = "block";

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/api/productos`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const productos = await res.json();
                const lista = document.getElementById("listaProductos");
                
                if (productos.length === 0) {
                    lista.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 30px;">No hay productos registrados.</td></tr>';
                    return;
                }

                lista.innerHTML = productos.map(p => `
                    <tr>
                        <td><strong>${p.nombre}</strong></td>
                        <td>${p.cantidad}</td>
                        <td>
                            ${rol === "ADMIN" ? `<button class="btn-danger" onclick="eliminarProducto('${p._id}')">Eliminar</button>` : '<span class="readonly-text">Solo lectura</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function guardarProducto() {
            const nombre = document.getElementById("nombre").value.trim();
            const cantidad = document.getElementById("cantidad").value.trim();

            if (!nombre || !cantidad) {
                alert("Completa todos los campos");
                return;
            }

            const res = await fetch(`${API_URL}/api/productos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ nombre, cantidad })
            });

            if (res.ok) {
                document.getElementById("nombre").value = "";
                document.getElementById("cantidad").value = "";
                cargarProductos();
            } else {
                alert("Error al guardar el producto");
            }
        }

        async function eliminarProducto(id) {
            if (rol !== "ADMIN") return;
            if (!confirm("¿Deseas eliminar este producto?")) return;

            const res = await fetch(`${API_URL}/api/productos/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) cargarProductos();
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        cargarProductos();
    </script>
</body>
</html>
