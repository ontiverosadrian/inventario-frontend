<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { padding: 20px; background: #f4f4f9; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .alert { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 4px; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="solicitudes.html">Solicitudes</a>
        <a href="reportes.html">Reportes</a>
        <button onclick="cerrarSesion()" style="float: right; background: #6c757d; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
    </nav>

    <h1>Reportes</h1>
    <br>

    <div class="card" id="contenidoReporte">
        <p>Cargando información...</p>
    </div>

    <script>
        const rol = localStorage.getItem("rolUsuario");
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "login.html";

        const contenedor = document.getElementById("contenidoReporte");

        if (rol === "ADMIN") {
            contenedor.innerHTML = `
                <h3>Panel de Reportes Generales</h3>
                <p style="margin-top: 10px; color: #555;">Aquí puedes consultar las estadísticas del sistema, movimientos de stock y exportar datos.</p>
                <button onclick="alert('Exportando datos...')" style="margin-top: 15px; padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Exportar Reporte</button>
            `;
        } else {
            contenedor.innerHTML = `
                <div class="alert">
                    <strong>Acceso Restringido:</strong> Esta sección de reportes está disponible únicamente para cuentas de Administrador.
                </div>
            `;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
